[project]
name = "rally-coach"
version = "0.1.0"
description = "Computer-vision and pose-estimation pipeline for tennis movement analytics and coaching advice."
requires-python = ">=3.11"
dependencies = [
  "opencv-python>=4.10",
  "mediapipe>=0.10.14",
  "numpy>=1.26",
  "scipy>=1.13",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov",
  "jsonschema>=4.22",   # validates output against export/schema/analysis.v1.json
  "ruff",
  "mypy",
  "nbstripout",
  "pre-commit",
]

[project.scripts]
rally-coach = "rally_coach.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rally_coach"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# Pinned explicitly. Ruff's DEFAULT rule set changes between releases, so
# leaving this unset means the repo lints clean on your machine and red on the
# next one — or after any `pip install -U ruff`.
[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "RUF",
]
ignore = [
  # The enums in core/types.py are `str, Enum` on purpose. Switching them to
  # StrEnum changes str(Joint.NOSE) from "Joint.NOSE" to "nose" — a silent
  # serialisation change inside a FROZEN schema. Not worth the tidiness.
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
# typer's whole API is function calls in argument defaults.
"src/rally_coach/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# mediapipe, cv2, typer and rich ship no type information. Without this, mypy's
# entire output is "module is installed but missing stubs" and nobody reads it.
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: drives the whole pipeline over a generated clip",
]
