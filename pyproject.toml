[project]
name = "rally-coach"
version = "0.1.0"
description = "Computer-vision and pose-estimation pipeline for tennis movement analytics and coaching advice."
requires-python = ">=3.11"
dependencies = [
  "opencv-python>=4.10",
  "mediapipe>=0.10.14",
  "numpy>=1.26",
  "scipy>=1.13",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov", "ruff", "mypy", "nbstripout"]

[project.scripts]
rally-coach = "rally_coach.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rally_coach"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
