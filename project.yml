name: Rally
options:
  bundleIdPrefix: com.marcelozap
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"        # iPhone only
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

targets:
  Rally:
    type: application
    platform: iOS
    sources:
      - path: Rally
    info:
      path: Rally/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcelozap.rally
        PRODUCT_NAME: Rally
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Rally checks your location once when you tap \"I'm here\" on an iconic court so we can unlock a tour cosmetic. We never track you in the background and never store coordinates."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: Rally
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - RallyTests

  RallyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RallyTests
    dependencies:
      - target: Rally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcelozap.rally.tests
        PRODUCT_NAME: RallyTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
